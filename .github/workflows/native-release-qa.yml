name: Exact-tag native Windows QA
on:
  push:
    branches: [qa/save-native-windows-v1.1.1-20261020]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Execute unchanged exact-tag native acceptance
        shell: pwsh
        run: |
          python -B .github/qa/save-native-v1.1.1/bootstrap.py --bundle .github/qa/save-native-v1.1.1/transfer.json --root "${{ runner.temp }}/save-native-hosted-v1.1.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain native acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: save-native-windows-v1.1.1-evidence
          path: ${{ runner.temp }}/save-native-hosted-v1.1.1/evidence/**
          if-no-files-found: error
